services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      TZ: America/Sao_Paulo
      ORACLE_PASSWORD: oracle_dev_123
      APP_USER: NFSE_OWNER
      APP_USER_PASSWORD: nfse_dev_123
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - ./db:/opt/nfse/db:ro
      - ./db/init.sh:/container-entrypoint-initdb.d/10_nfse.sh:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  webservices:
    build: .
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_URLS: http://+:8080
      NFSE_CONNECTION_STRING: "User Id=NFSE_OWNER;Password=nfse_dev_123;Data Source=oracle:1521/FREEPDB1;Min Pool Size=2;Connection Timeout=30"
    mem_limit: 3g
    expose:
      - "8080"
    depends_on:
      oracle:
        condition: service_healthy

  fachada:
    build:
      context: .
      dockerfile: fachada/Dockerfile
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_URLS: http://+:8080
      Legacy__BaseUrl: http://webservices:8080
      Legacy__PublicServiceUrl: http://localhost:8080/NfseWS.asmx
      Legacy__TimeoutSeconds: "${LEGACY_TIMEOUT_SECONDS:-660}"
      Modern__BaseUrl: http://consulta:8080
      Routing__File: /app/routing/routing.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observabilidade:18889
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_EXPORTER_OTLP_TIMEOUT: "1000"
    volumes:
      # Mount the directory so atomic file replacement is visible inside the container.
      - ./fachada/config:/app/routing:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      webservices:
        condition: service_started

  consulta:
    build:
      context: .
      dockerfile: novo/Dockerfile
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_URLS: http://+:8080
      NFSE_CONNECTION_STRING: "User Id=NFSE_OWNER;Password=nfse_dev_123;Data Source=oracle:1521/FREEPDB1;Min Pool Size=0;Max Pool Size=10;Connection Timeout=10"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observabilidade:18889
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_EXPORTER_OTLP_TIMEOUT: "1000"
    mem_limit: 512m
    expose:
      - "8080"
    depends_on:
      oracle:
        condition: service_healthy

  # Standalone OTLP viewer, in-memory data, no AppHost or additional database.
  observabilidade:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.0
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
    expose:
      - "18889"
    mem_limit: 512m

volumes:
  oracle-data:
