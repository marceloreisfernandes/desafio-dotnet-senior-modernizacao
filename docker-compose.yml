services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      TZ: America/Sao_Paulo
      ORACLE_PASSWORD: oracle_dev_123
      APP_USER: NFSE_OWNER
      APP_USER_PASSWORD: nfse_dev_123
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - ./db:/opt/nfse/db:ro
      - ./db/init.sh:/container-entrypoint-initdb.d/10_nfse.sh:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  webservices:
    build: .
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_URLS: http://+:8080
      NFSE_CONNECTION_STRING: "User Id=NFSE_OWNER;Password=nfse_dev_123;Data Source=oracle:1521/FREEPDB1;Min Pool Size=2;Connection Timeout=30"
    mem_limit: 3g
    expose:
      - "8080"
    depends_on:
      oracle:
        condition: service_healthy

  fachada:
    build:
      context: .
      dockerfile: fachada/Dockerfile
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_URLS: http://+:8080
      Legacy__BaseUrl: http://webservices:8080
      Legacy__PublicServiceUrl: http://localhost:8080/NfseWS.asmx
      Legacy__TimeoutSeconds: "120"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      webservices:
        condition: service_started

volumes:
  oracle-data:
