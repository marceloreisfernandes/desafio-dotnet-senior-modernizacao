name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (net48 + net8.0)
        run: dotnet build legado/NotaCarioca.sln -c Release
      - name: Testes unitarios (net8.0)
        run: dotnet test legado/tests/NotaCarioca.Testes -c Release -f net8.0 --no-build
      - name: Testes da fachada HTTP/SOAP (net8.0)
        run: dotnet test fachada/tests/NotaCarioca.Fachada.Testes -c Release --filter 'TestCategory!=Oracle'
      - name: Consulta independente — aplicação e contratos HTTP/SOAP
        run: dotnet test novo/tests/NotaCarioca.Consulta.Testes -c Release --filter 'TestCategory!=Oracle'
